name: publish-cache

on:
  workflow_call:
    inputs:
      host:
        description: "対象 host を 1 つだけ指定したい場合（空なら全 host）"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      host:
        description: "対象 host を 1 つだけ指定したい場合（空なら全 host）"
        required: false
        type: string

concurrency:
  group: publish-cache-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production

    steps:
      - name: Checkout flake source (this repo)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout cf-edgeNix (publish tooling)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: T4ko0522/cf-edgeNix
          ref: main
          path: .cf-edgenix

      - name: Resolve target hosts
        id: hosts
        env:
          REQUESTED: ${{ inputs.host }}
        run: |
          if [ -z "$REQUESTED" ]; then
            echo "list=host1 host2" >> "$GITHUB_OUTPUT"
          else
            case "$REQUESTED" in
              host1|host2)
                echo "list=$REQUESTED" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "unknown host: $REQUESTED" >&2
                exit 1
                ;;
            esac
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://nix.t4ko.pet https://vicinae.cachix.org https://cache.numtide.com https://codex-desktop-linux.cachix.org https://noctalia.cachix.org https://nix-community.cachix.org https://cache.nixos.org
            trusted-public-keys = nix.t4ko.pet-1:0eRO18L1/5diWYWboKKPTejQGhGCHNITwELiUaX7Kps= vicinae.cachix.org-1:1kDrfienkGHPYbkpNj1mWTr7Fm1+zcenzgTizIcI3oc= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= codex-desktop-linux.cachix.org-1:nX/xy6AdK9hQE24A8ALGjkCKj2ObFmcnemiL5Cid4nk= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            accept-flake-config = true

      - name: Show disk usage
        run: |
          df -h
          sudo du -sh /nix/store || true
          du -sh "$RUNNER_TEMP" || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.cf-edgenix/bun.lock', '.cf-edgenix/bun.lockb', '.cf-edgenix/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install cf-edgeNix deps
        working-directory: .cf-edgenix
        run: bun install --frozen-lockfile

      - name: Build, sign & publish
        env:
          HOSTS: ${{ steps.hosts.outputs.list }}
          CACHE_DIR: ${{ runner.temp }}/cf-edgenix-cache
          CACHE_PRIVATE_KEY: ${{ secrets.CACHE_PRIVATE_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SELF_CACHE_URL: ${{ vars.SELF_CACHE_URL || 'https://nix.t4ko.pet' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          GIT_REV: ${{ github.sha }}
          FLAKE_LOCK_HASH: ${{ hashFiles('flake.lock') }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          trap 'rm -rf -- "$CACHE_DIR"' EXIT
          mkdir -p "$CACHE_DIR"
          read -r -a hosts <<< "$HOSTS"
          bash .cf-edgenix/scripts/publish.sh "${hosts[@]}"
